[package]
name = "anoma-pa-solana-integration-test"
description = "Integration and e2e tests for the Anoma Solana protocol adapter: pa-testkit's environments on a surfpool runtime or, for e2e settlements, on a cluster itself."
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anoma/solana-protocol-adapter"
publish = false

# Its own workspace: surfpool-sdk pins Solana crates (solana-instruction ~3.4,
# solana-clock ~3.1) that would lower the versions the programs build against
# if it shared their lockfile.
[workspace]

[features]
default = ["local"]
local = ["anoma-pa-testkit/local"]
e2e = [
  "anoma-pa-testkit/e2e",
  "anoma-pa-testkit/prove",
  "dep:anoma-risc0-kind-trees",
  "dep:dotenvy",
  "dep:solana-cluster-type",
  "dep:url",
]

[dependencies]
# The Anchor traits of the client's generated types (their discriminators,
# account encodings): the client's Anchor commit.
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "2c9747a2d31bd5e94745cee6c083577f3e6675c0" }
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "94c4b3bb5b4c74d66093330d79cebca789120552", features = [
  "rpc",
] }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "e4e28f34ab7d8fc0212413283c32503f110638be", default-features = false, features = [
  "fixtures",
] }
anoma-risc0-kind-trees = { git = "https://github.com/anoma/risc0-kind-tables", rev = "999fcf47627468fd35ad8ad16464ce28f6e443dd", features = [
  "arm",
], optional = true }
anoma-rm-risc0 = { version = "=2.0.0-rc.8.1", default-features = false, features = ["transaction"] }
anyhow = "1.0"
bincode = "1.3"
bs58 = "0.5"
dotenvy = { version = "0.15", optional = true }
futures = "0.3"
serde_json = "1.0"
# The genesis hashes of the clusters, which name the cluster an e2e runtime
# reaches.
solana-cluster-type = { version = "3", optional = true }
solana-commitment-config = "3.1"
solana-instruction = "3"
solana-keypair = "3.1"
solana-loader-v3-interface = { version = "7", features = ["serde"] }
solana-sdk-ids = "3"
solana-message = "4"
solana-rpc-client = "4"
solana-rpc-client-api = "4"
solana-rpc-client-types = "4"
solana-signature = "3"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-status-client-types = "4"
# The token programs a live cluster is sent the payer's instructions of.
spl-associated-token-account-interface = "2"
spl-token-2022-interface = "2"
spl-token-interface = "2"
surfpool-sdk = "=1.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# The host of an e2e runtime's RPC endpoint, which must not be a public one.
url = { version = "2", optional = true }

[dev-dependencies]
solana-system-interface = { version = "3.2", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The cfgs `declare_program!`'s output tests: the Solana target, and the
# `idl-build` feature of a program crate, which this crate is not.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("idl-build"))',
] }
