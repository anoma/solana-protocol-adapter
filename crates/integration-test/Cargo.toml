[package]
name = "anoma-pa-solana-integration-test"
description = "Integration and e2e tests for the Anoma Solana protocol adapter: pa-testkit's environments on a surfpool runtime."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anoma/solana-protocol-adapter"
publish = false

# Its own workspace: surfpool-sdk pins Solana crates (solana-instruction ~3.4,
# solana-clock ~3.1) that would lower the versions the programs build against
# if it shared their lockfile.
[workspace]

[features]
default = ["local"]
local = ["anoma-pa-testkit/local"]
e2e = [
  "anoma-pa-testkit/e2e",
  "anoma-pa-testkit/prove",
  "dep:anoma-risc0-kind-tables",
  "dep:dotenvy",
]

[dependencies]
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "6b2f41cf613ccaf593bee79bc138c71dd1f7ab4c", features = [
  "arm",
] }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "ab0356bd914e355df80b9f47f3dbf181413c022b", default-features = false, features = [
  "fixtures",
] }
anoma-risc0-kind-tables = { git = "https://github.com/anoma/risc0-kind-tables", rev = "919c7787259eca02b8cedb079a639ad31e04ae51", features = [
  "arm",
], optional = true }
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false, features = ["transaction"] }
anyhow = "1.0"
bincode = "1.3"
bs58 = "0.5"
dotenvy = { version = "0.15", optional = true }
futures = "0.3"
serde_json = "1.0"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
solana-commitment-config = "3.1"
solana-instruction = "3"
solana-keypair = "3.1"
solana-loader-v3-interface = { version = "7", features = ["serde"] }
solana-sdk-ids = "3"
solana-message = "4"
solana-rpc-client = "4"
solana-rpc-client-api = "4"
solana-rpc-client-types = "4"
solana-signature = "3"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-status-client-types = "4"
surfpool-sdk = "=1.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
solana-packet = "4"
solana-system-interface = { version = "3.2", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
