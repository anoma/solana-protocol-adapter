services:
  # Development environment with all tooling
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
        DOCKER_GID: ${DOCKER_GID:-30001}
    container_name: solana-pa-dev
    # Run as root inside container. In rootless Docker, container root maps to
    # the host user (UID 1000), giving correct workspace permissions. Set HOME
    # so volume mounts and tool paths (solana, anchor, cargo) resolve correctly.
    user: "0:0"
    # Enable NVIDIA GPU access for CUDA-accelerated proving
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Mount grandparent (solana-pa/) to make both repos available:
      # /workspace/solana-protocol-adapter/ and /workspace/arm-risc0/
      - ../..:/workspace
      # Allow tooling (e.g. risc0 Groth16 prover) to run Docker via the host daemon.
      # Use XDG_RUNTIME_DIR for rootless Docker, fallback to /var/run for system Docker
      - ${XDG_RUNTIME_DIR:-/var/run}/docker.sock:/var/run/docker.sock
      # Required for risc0-groth16: it bind-mounts a temp dir; with docker.sock it must be a host-visible path.
      - /tmp:/tmp
      # Persist cargo cache
      - cargo-cache:/home/developer/.cargo/registry
      - cargo-git:/home/developer/.cargo/git
      # Persist Solana platform-tools (downloaded by cargo build-sbf)
      - solana-cache:/home/developer/.cache/solana
      # Persist Solana config
      - solana-config:/home/developer/.config/solana
    ports:
      # Solana validator RPC
      - "8899:8899"
      # Solana validator websocket
      - "8900:8900"
      # Solana validator faucet
      - "9900:9900"
    environment:
      - HOME=/home/developer
      - RUST_BACKTRACE=1
      - RUST_LOG=solana_runtime::system_instruction_processor=trace,solana_runtime::message_processor=trace
      - DOCKER_HOST=unix:///var/run/docker.sock
    stdin_open: true
    tty: true
    working_dir: /workspace/solana-protocol-adapter/solana-pa-prototype
    command: /bin/bash

  # Solana test validator as a separate service (optional)
  validator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
        DOCKER_GID: ${DOCKER_GID:-30001}
    container_name: solana-validator
    user: "0:0"
    volumes:
      - solana-config:/home/developer/.config/solana
    ports:
      - "8899:8899"
      - "8900:8900"
      - "9900:9900"
    environment:
      - HOME=/home/developer
      - RUST_BACKTRACE=1
    command: >
      solana-test-validator
      --reset
      --ledger /home/developer/validator-ledger
      --rpc-port 8899
      --faucet-port 9900
      --bind-address 0.0.0.0
      --url devnet
      --clone-upgradeable-program BetEAE4npinksQBxvqUN1KkCVjYFJywWao45MSWtp5yg
      --clone-upgradeable-program 2Yfa83Lzbn71ie3J1KQRiNQz1qHnvVm8gkBCpXZQ7ajD
      --clone 9ZJmYSYaYq38GfwQMsEw5gkzfr94Vbzw6Nv53yQuCv2S
      --clone 4ktbrXwBXZMoND5qb3J6abS1m8KqwUtCjjDBebJ4vqey
      --log
    profiles:
      - validator

volumes:
  cargo-cache:
  cargo-git:
  solana-cache:
  solana-config:
