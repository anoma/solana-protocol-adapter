services:
  dind:
    image: docker:24-dind
    privileged: true
    container_name: solana-pa-dind
    environment:
      - DOCKER_TLS_CERTDIR=
    command: --host=tcp://0.0.0.0:2375
    volumes:
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Development environment with all tooling
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        DOCKER_GID: ${DOCKER_GID:-30001}
    container_name: solana-pa-dev
    volumes:
      # Mount entire parent repo to preserve submodule git references
      - ..:/workspace
      # Required for risc0-groth16: it bind-mounts a temp dir; with docker.sock it must be a host-visible path.
      - /tmp:/tmp
      # Persist cargo cache
      - cargo-cache:/home/developer/.cargo/registry
      - cargo-git:/home/developer/.cargo/git
      # Persist Solana platform-tools (downloaded by cargo build-sbf)
      - solana-cache:/home/developer/.cache/solana
      # Persist Solana config
      - solana-config:/home/developer/.config/solana
    ports:
      # Solana validator RPC
      - "8899:8899"
      # Solana validator websocket
      - "8900:8900"
      # Solana validator faucet
      - "9900:9900"
    environment:
      - HOME=/home/developer
      - CARGO_HOME=/home/developer/.cargo
      - RUSTUP_HOME=/home/developer/.rustup
      - RUST_BACKTRACE=1
      - RUST_LOG=solana_runtime::system_instruction_processor=trace,solana_runtime::message_processor=trace
      - DOCKER_HOST=tcp://dind:2375
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    depends_on:
      dind:
        condition: service_healthy
    stdin_open: true
    tty: true
    working_dir: /workspace/solana-pa-prototype
    command: /bin/bash

  # Solana test validator as a separate service (optional)
  validator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        DOCKER_GID: ${DOCKER_GID:-30001}
    container_name: solana-validator
    volumes:
      - solana-config:/home/developer/.config/solana
    ports:
      - "8899:8899"
      - "8900:8900"
      - "9900:9900"
    environment:
      - RUST_BACKTRACE=1
    command: >
      solana-test-validator
      --reset
      --ledger /home/developer/validator-ledger
      --rpc-port 8899
      --faucet-port 9900
      --bind-address 0.0.0.0
      --url devnet
      --clone-upgradeable-program BetEAE4npinksQBxvqUN1KkCVjYFJywWao45MSWtp5yg
      --clone-upgradeable-program 2Yfa83Lzbn71ie3J1KQRiNQz1qHnvVm8gkBCpXZQ7ajD
      --clone 9ZJmYSYaYq38GfwQMsEw5gkzfr94Vbzw6Nv53yQuCv2S
      --clone 4ktbrXwBXZMoND5qb3J6abS1m8KqwUtCjjDBebJ4vqey
      --log
    profiles:
      - validator

volumes:
  cargo-cache:
  cargo-git:
  solana-cache:
  solana-config:
  dind-data:
