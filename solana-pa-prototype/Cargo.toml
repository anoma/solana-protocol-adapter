[workspace]
members = [
    "programs/*"
]
resolver = "2"

# solana-verify picks its deterministic build image from this version; without
# it the tool falls back to the solana-program crate version (2.x), whose
# platform-tools cannot parse the edition-2024 manifests in our dependency
# graph. Keep in lockstep with flake.nix's solanaVersion and CI.
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.dependencies]
anchor-lang = "1.2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
