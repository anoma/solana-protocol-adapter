[package]
name = "spl-token-forwarder"
version = "0.1.0"
description = "SPL Token forwarder for wrap/unwrap operations with Ed25519 signature verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spl_token_forwarder"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Enable verbose debug logging (field dumps, step-by-step progress)
# Disabled by default for production to reduce compute units and log noise
verbose-logging = []

[dependencies]
anchor-lang = "0.31.1"
