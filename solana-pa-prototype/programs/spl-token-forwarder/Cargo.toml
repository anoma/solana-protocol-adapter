[package]
name = "spl-token-forwarder"
version = "2.0.0-rc.3"
description = "SPL Token forwarder for wrap/unwrap operations with Ed25519 signature verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spl_token_forwarder"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "protocol-adapter/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Development builds only: dev_set_config_version, for testing reinitialize.
dev-config-version = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
solana-instructions-sysvar = "5.0"
solana-sdk-ids = "3.1"
solana-sha256-hasher = "3.1"
# Standard base64 of the signed message hash. 0.21 is the version anchor-lang
# 1.2.0 requires, so the on-chain graph has one base64.
base64 = "0.21.7"
# The adapter's state account type, so the emergency-stopped check reads the
# lifecycle field through the adapter's own layout instead of byte offsets.
protocol-adapter = { path = "../solana-pa-prototype", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
# The off-chain encoder of this program's inputs; the parser tests read what it writes.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "6fa81a51cf4fde3e65260a2f0c7c1cf4bc4a8287", default-features = false }
hex-literal = "1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
