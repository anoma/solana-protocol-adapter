[package]
name = "mock-verifier"
version = "0.1.0"
description = "LOCALNET-ONLY mock proof verifier for integration tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
# RISC Zero's own receipt-claim digest: the claim the Groth16 verifier's
# public inputs commit to.
risc0-zkvm = { version = "3.0.3", default-features = false }
