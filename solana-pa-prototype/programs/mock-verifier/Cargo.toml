[package]
name = "mock-verifier"
version = "0.1.0"
description = "LOCALNET-ONLY mock proof verifier for integration tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
# hash_claim and the Proof type — reusing the real verifier's claim-digest
# computation guarantees the mock can never drift from it.
groth_16_verifier = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0", features = ["cpi"] }
