[package]
name = "mock-verifier"
version = "0.1.0"
description = "LOCALNET-ONLY mock proof verifier for integration tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
# RISC Zero's claim hashing (tagged structs, SystemState, ExitCode). The
# ReceiptClaim type itself lives in risc0-zkvm, which always links the
# Groth16 prover/verifier, whose functions overflow the SBF stack frame; the
# claim digest is composed here from these parts and checked against
# risc0-zkvm's ReceiptClaim in the host tests.
risc0-binfmt = { version = "3.0.4", default-features = false }
risc0-zkp = { version = "3.0.4", default-features = false }

[dev-dependencies]
risc0-zkvm = { version = "3.0.3", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
