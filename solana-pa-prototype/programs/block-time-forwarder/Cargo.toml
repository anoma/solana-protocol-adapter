[package]
name = "block-time-forwarder"
version = "0.1.0"
description = "Example forwarder program for time comparison"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "block_time_forwarder"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
