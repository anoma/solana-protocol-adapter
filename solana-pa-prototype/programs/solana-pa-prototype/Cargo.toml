[package]
name = "protocol-adapter"
version = "0.1.0"
description = "Solana Protocol Adapter for Anoma Resource Machine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "protocol_adapter"

[features]
default = ["custom-heap"]
cpi = ["no-entrypoint"]
custom-heap = []
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-panic = []
# Development-only instructions: marker PDA reclamation (`close_markers_batch`)
# and schema-version poking for the upgrade-guard test
# (`dev_set_schema_version`). Deliberately excluded from `default`; the
# release build asserts both are absent from the IDL. Must never be enabled
# in a production build.
dev-teardown = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
solana-sha256-hasher = "3.1"

# Serialization - must match arm-risc0 exactly
# held at 1.3: anoma-rm-core 2.0.0-rc.6 encodes Transaction with bincode 1.3; bincode 3.0.0 is a compile_error! stub
bincode = "1.3.3"
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }

# BN254 G1 negation of the seal's pi_a before the verifier router CPI.
# held at 0.5: solana-bn254 3.2.1 (dev-dependency) requires ark ^0.5; one ark version in the graph
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5.0", default-features = false }

hex-literal = "1.1"

# ARM core types (no zkvm dependency, Borsh serialization)
arm-core = { package = "anoma-rm-core", version = "=2.0.0-rc.6", features = ["borsh"] }
# ARM Solana-specific types (Borsh, syscalls, delta verification)
arm-solana = { package = "anoma-rm-solana", version = "=2.0.0-rc.6" }

# arm-solana's delta verification calls the sol_secp256k1_recover syscall
# through solana-nostd-secp256k1-recover. SBPF v3 programs may not carry
# undefined symbols, so v3 targets reach syscalls by their static hash; that
# crate selects the static form with this Cargo feature instead of the
# target's `static-syscalls` target feature, so the targets that have the
# target feature turn the Cargo feature on here.
[target.'cfg(target_feature = "static-syscalls")'.dependencies]
solana-nostd-secp256k1-recover = { version = "0.2.0", features = ["static-syscalls"] }

[dev-dependencies]
# Forwarder example program (used in tests for constants/encoding)
block-time-forwarder = { path = "../block-time-forwarder", default-features = false, features = ["no-entrypoint"] }

# SHA-256 equivalence testing (verifying syscall matches software implementation)
sha2 = "0.11"

# Host alt_bn128 G1 addition, checking pi_a negation against the curve group law
solana-bn254 = "3.2.1"

# Property-based testing (fuzzing parity with EVM PA)
proptest = "1.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
