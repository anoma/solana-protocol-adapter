[package]
name = "solana-pa-prototype"
version = "0.1.0"
description = "Solana Protocol Adapter for Anoma Resource Machine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_pa_prototype"

[features]
default = ["custom-heap"]
cpi = ["no-entrypoint"]
custom-heap = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anoma-pa-solana-client = { workspace = true }
solana-system-interface = "1.0"

# Serialization - must match arm-risc0 exactly
bincode = "1.3.3"
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }

# CPI into risc0-solana Verifier Router (for dual emergency check / EVM parity)
# Routes through groth_16_verifier with built-in estopped check
# Using git dependency instead of submodule to simplify build process
verifier_router = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0", features = ["cpi"] }
# Need groth_16_verifier for Proof type (verifier_router uses but doesn't re-export)
groth_16_verifier = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0" }

hex-literal = "0.4"

# ARM core types (no zkvm dependency, Borsh serialization)
arm-core = { package = "anoma-rm-core", git = "https://github.com/anoma/arm-risc0", branch = "solana", features = ["borsh"] }
# ARM Solana-specific types (Borsh, syscalls, delta verification)
arm-solana = { package = "anoma-rm-solana", git = "https://github.com/anoma/arm-risc0", branch = "solana" }


[dev-dependencies]
# Forwarder example program (used in tests for constants/encoding)
block-time-forwarder = { path = "../block-time-forwarder", default-features = false, features = ["no-entrypoint"] }

# SHA-256 equivalence testing (verifying syscall matches software implementation)
sha2 = "0.10"

# Property-based testing (fuzzing parity with EVM PA)
proptest = "1.4"
