[package]
name = "solana-pa-prototype"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_pa_prototype"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
solana-system-interface = "1.0"

# Serialization - must match arm-risc0 exactly
bincode = "1.3.3"
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

# CPI into risc0-solana Verifier Router (for dual emergency check / EVM parity)
# Routes through groth_16_verifier with built-in estopped check
# Using git dependency instead of submodule to simplify build process
verifier_router = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0", features = ["cpi"] }
# Need groth_16_verifier for Proof type (verifier_router uses but doesn't re-export)
groth_16_verifier = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0" }

# Word/byte conversion (matches arm-risc0)
bytemuck = { version = "1.14", features = ["derive"] }

# Hex encoding for constants
hex = "0.4"
hex-literal = "0.4"

# ARM shared types (solana feature excludes risc0-zkvm dependency)
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0.git", branch = "anthony/solana-integration-stage-1", default-features = false, features = ["solana"] }

# Pin: base64ct >=1.8 requires edition 2024, incompatible with Rust 1.84
base64ct = "<=1.7.3"

# Delta proof verification (secp256k1 EC operations via Solana syscalls)
solana-secp256k1 = "0.1"

# Big integer arithmetic for curve validation (re-export from solana-secp256k1's dependency)
dashu = "0.4"

[dev-dependencies]
# Forwarder example program (used in tests for constants/encoding)
block-time-forwarder = { path = "../block-time-forwarder", default-features = false, features = ["no-entrypoint"] }

# SHA-256 equivalence testing (verifying syscall matches software implementation)
sha2 = "0.10"

# BN254 field arithmetic for negate_pi_a tests
num-bigint = "0.4"
num-traits = "0.2"

# Solana program testing (must match anchor-lang's solana version)
solana-program-test = "2.1"
solana-sdk = "2.1"
tokio = { version = "1", features = ["full"] }

# Property-based testing (fuzzing parity with EVM PA)
proptest = "1.4"
