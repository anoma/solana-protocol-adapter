[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arm = { package = "anoma-rm-risc0", git = "https://github.com/anoma/arm-risc0", branch = "anthony/arm-solana-crate-split", default-features = false, features = ["aggregation", "prove"] }
sha2 = "0.10"
verifier_router = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0" }
base64 = "0.22"
bincode = "1.3.3"
hex = "0.4"
k256 = "=0.13.3"
rayon = "1.10"
risc0-zkvm = "3.0.3"
passthrough-logic-methods = { path = "passthrough-logic/methods" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor-lang = {version = "0.31.1"}

[workspace]
members = ["passthrough-logic/methods"]
