[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bs58 = "0.5"
arm = { package = "anoma-rm-risc0", git = "https://github.com/anoma/arm-risc0", branch = "solana", default-features = false, features = ["aggregation", "prove"] }
sha2 = "0.10"
verifier_router = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0" }
# Proof type for constructing mock seals (verifier_router uses but doesn't re-export)
groth_16_verifier = { git = "https://github.com/risc0/risc0-solana.git", tag = "v3.0.0" }
base64 = "0.22"
anchor-lang = "0.31.1"
bincode = "1.3.3"
hex = "0.4"
k256 = "=0.13.3"
risc0-zkvm = "3.0.3"
passthrough-logic-methods = { path = "passthrough-logic/methods" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
block-time-forwarder = { path = "../../programs/block-time-forwarder", default-features = false, features = ["no-entrypoint"] }
test-forwarder = { path = "../../programs/test-forwarder", default-features = false, features = ["no-entrypoint"] }
solana-pa = { package = "protocol-adapter", path = "../../programs/solana-pa-prototype", default-features = false, features = ["no-entrypoint"] }
heliax-ap-orchestrator-sdk = { git = "https://github.com/anoma/anomapay-workers-queue.git", rev = "5cda5181ccff13e9b8204d3a8aa52ab50303aac1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[workspace]
members = ["passthrough-logic/methods"]
