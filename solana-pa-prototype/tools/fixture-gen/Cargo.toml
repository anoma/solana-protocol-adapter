[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arm = { path = "../../../arm-risc0/arm", features = ["aggregation", "solana"] }
arm-test-app = { path = "../../../arm-risc0/arm_tests/arm_test_app" }
base64 = "0.22"
