[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
# Merkle paths over the adapter's tree, as integrators derive them.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "4b1758b5b3037533ebbfccbec3e376d028323f3b", default-features = false, features = ["arm"] }
arm = { package = "anoma-rm-risc0", version = "=2.0.0-rc.6", default-features = false, features = ["aggregation", "prove"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
# The programs' Anchor commit (solana-pa-prototype/Cargo.toml); the published
# 1.2.1 replaces it in anoma/solana-protocol-adapter#124.
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "2c9747a2d31bd5e94745cee6c083577f3e6675c0" }
# Must match anoma-rm-risc0 2.0.0-rc.6, which encodes Transaction with bincode 1.3.
bincode = "1.3.3"
hex = "0.4"
# anoma-rm-risc0's Scalar/AffinePoint types; it pins the version (=0.13.3).
k256 = "0.13"
risc0-zkvm = "3.0.6"
# The pass-through logic the fixtures' external calls ride on.
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "bcf09547598bfcbf1ab30aecdad3279d7ba85acb", default-features = false, features = [
  "fixtures",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
block-time-forwarder = { path = "../../programs/block-time-forwarder", default-features = false, features = ["no-entrypoint"] }
test-forwarder = { path = "../../programs/test-forwarder", default-features = false, features = ["no-entrypoint"] }
solana-pa = { package = "protocol-adapter", path = "../../programs/solana-pa-prototype", default-features = false, features = ["no-entrypoint"] }
heliax-ap-orchestrator-sdk = { git = "https://github.com/anoma/anomapay-workers-queue.git", rev = "5cda5181ccff13e9b8204d3a8aa52ab50303aac1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Concurrent proof dispatch through the queue (try_join!, try_join_all).
futures = "0.3"

[workspace]
