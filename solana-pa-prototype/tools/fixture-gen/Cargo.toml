[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
# Merkle paths over the adapter's tree, as integrators derive them.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "6fa81a51cf4fde3e65260a2f0c7c1cf4bc4a8287", default-features = false }
arm = { package = "anoma-rm-risc0", version = "=2.0.0-rc.6", default-features = false, features = ["aggregation", "prove"] }
arm-gadgets = { package = "anoma-rm-risc0-gadgets", version = "=2.0.0-rc.6" }
# The AnomaPay transfer resource: its logic proves the SPL forwarder fixtures.
transfer_library = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "8969825eef8b676822207a420716fdad9b5eda24" }
transfer_witness = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "8969825eef8b676822207a420716fdad9b5eda24" }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
anchor-lang = "1.2.0"
# Must match anoma-rm-risc0 2.0.0-rc.6, which encodes Transaction with bincode 1.3.
bincode = "1.3.3"
hex = "0.4"
# anoma-rm-risc0's Scalar/AffinePoint types; it pins the version (=0.13.3).
k256 = "0.13"
# Seeded randomness for the created resources' encryption (k256's rand_core 0.6).
rand_chacha = "0.3"
risc0-zkvm = "3.0.6"
passthrough-logic-methods = { path = "passthrough-logic/methods" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
block-time-forwarder = { path = "../../programs/block-time-forwarder", default-features = false, features = ["no-entrypoint"] }
test-forwarder = { path = "../../programs/test-forwarder", default-features = false, features = ["no-entrypoint"] }
spl-token-forwarder = { path = "../../programs/spl-token-forwarder", default-features = false, features = ["no-entrypoint"] }
ed25519-dalek = "3.0"
solana-pa = { package = "protocol-adapter", path = "../../programs/solana-pa-prototype", default-features = false, features = ["no-entrypoint"] }
heliax-ap-orchestrator-sdk = { git = "https://github.com/anoma/anomapay-workers-queue.git", rev = "5cda5181ccff13e9b8204d3a8aa52ab50303aac1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Concurrent proof dispatch through the queue (try_join!, try_join_all).
futures = "0.3"

[workspace]
members = ["passthrough-logic/methods"]
