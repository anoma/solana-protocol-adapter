[package]
name = "fixture-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arm = { git = "https://github.com/anoma/arm-risc0", rev = "7a6c2e7e5c100c50028f46516cecbfa9c9127e52", default-features = false, features = ["aggregation", "solana", "prove"] }
#arm-test-app = { path = "../../../arm-risc0/arm_tests/arm_test_app" }
verifier_router = {path = "../../../risc0-solana/solana-verifier/programs/verifier_router/"}
base64 = "0.22"
bincode = "1.3.3"
hex = "0.4"
k256 = "=0.13.3"
rayon = "1.10"
risc0-zkvm = "3.0.3"
passthrough-logic-methods = { path = "passthrough-logic/methods" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor-lang = {version = "0.31.1"}

[workspace]
members = ["passthrough-logic/methods"]
