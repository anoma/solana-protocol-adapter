[package]
name = "passthrough-logic-methods"
version = "0.1.0"
edition = "2021"

[build-dependencies]
# Exact: the v1compat kernel ELF is linked into the guest image and
# risc0-binfmt computes its id, so a version change rotates the image id.
risc0-binfmt = { version = "=3.0.5", features = ["std"], default-features = false }
risc0-zkos-v1compat = "=2.2.3"

[package.metadata.risc0]
methods = ["guest"]
