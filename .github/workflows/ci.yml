name: CI

on:
  pull_request:
    branches: [main, anthony/arm-v2-port]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match flake.nix's rustToolchain.
  RUST_VERSION: "1.98.1"
  # Must match flake.nix's solanaVersion.
  SOLANA_VERSION: "4.3.0"
  # Anchor's v1.2.1 release PR (solana-foundation/anchor#5134), the commit
  # solana-pa-prototype/Cargo.toml and flake.nix pin; no release binary exists
  # for it, so the CLI is built from source. The published 1.2.1 replaces it in
  # anoma/solana-protocol-adapter#124.
  ANCHOR_REV: "2c9747a2d31bd5e94745cee6c083577f3e6675c0"

jobs:
  # Rust format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Check formatting
        working-directory: ./solana-pa-prototype
        run: cargo fmt --all --check

  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      # Lints the workspace, then each program with dev features (e.g. the
      # PA's dev-teardown instructions) again with them enabled, since
      # production builds never compile that gated code.
      - name: Run clippy
        working-directory: ./solana-pa-prototype
        run: ./scripts/ops.sh clippy

  # Rust unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      - name: Run tests
        working-directory: ./solana-pa-prototype
        run: ./scripts/ops.sh unit-test

  # The integration-test harness (crates/integration-test, its own
  # workspace): its local tests on surfpool. Its e2e cases need devnet and the
  # proving queue (dev.sh harness-test --cluster devnet).
  harness:
    name: Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/integration-test

      - name: Check formatting
        working-directory: ./crates/integration-test
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: ./crates/integration-test
        run: cargo clippy --all-targets --features e2e -- -D warnings

      - name: Run tests
        working-directory: ./solana-pa-prototype
        run: ./scripts/ops.sh harness-test

  # The integration-test harness ships the programs it loads; each must be
  # the deterministic build of this commit.
  harness-programs:
    name: Harness Programs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.2 --locked

      - name: Check the committed binaries are the deterministic builds
        working-directory: ./solana-pa-prototype
        run: ./scripts/ops.sh harness-programs --check

  # Build the programs once; the per-mode test jobs below reuse the
  # artifacts instead of repeating the SBF build.
  anchor-build:
    name: Anchor Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Create Solana keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/otter-sec/anchor --rev "${{ env.ANCHOR_REV }}" --locked anchor-cli

      - name: Install node dependencies
        working-directory: ./solana-pa-prototype
        run: yarn install --frozen-lockfile

      - name: Check TypeScript formatting
        working-directory: ./solana-pa-prototype
        run: yarn run lint

      - name: Build programs
        working-directory: ./solana-pa-prototype
        run: ./scripts/anchor-test.sh build

      - name: Upload program artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anchor-programs
          if-no-files-found: error
          path: |
            solana-pa-prototype/target/deploy
            solana-pa-prototype/target/idl
            solana-pa-prototype/target/types

  # Anchor integration tests, once per proof mode: real Groth16 fixtures
  # against the devnet-cloned verifier, and mock fixtures against the
  # localnet mock verifier. No Rust toolchain needed — the programs come
  # from the anchor-build job.
  anchor-test:
    name: Anchor Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: anchor-build
    strategy:
      fail-fast: false
      matrix:
        mode: [real, mock]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Create Solana keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/otter-sec/anchor --rev "${{ env.ANCHOR_REV }}" --locked anchor-cli

      - name: Install node dependencies
        working-directory: ./solana-pa-prototype
        run: yarn install --frozen-lockfile

      - name: Download program artifacts
        uses: actions/download-artifact@v8
        with:
          name: anchor-programs
          path: solana-pa-prototype/target

      - name: Run tests
        working-directory: ./solana-pa-prototype
        run: PA_TEST_MODE=${{ matrix.mode }} ./scripts/anchor-test.sh test
