name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.93.0"
  # Must match the Solana pinned by flake.nix (solanaVersion) — the SBF build
  # runs under platform-tools' own cargo, and an older one cannot parse
  # edition-2024 manifests in the dependency graph.
  SOLANA_VERSION: "3.1.14"
  ANCHOR_VERSION: "0.31.1"

jobs:
  # Rust format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Check formatting
        working-directory: ./solana-pa-prototype
        run: cargo fmt --all --check

  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      - name: Run clippy
        working-directory: ./solana-pa-prototype
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A unexpected_cfgs \
            -A deprecated

      # close_markers_batch and its account struct compile only under
      # dev-teardown, which production builds do not enable. Without this the
      # gated code is never linted at all.
      - name: Run clippy (dev-teardown feature)
        working-directory: ./solana-pa-prototype
        run: |
          cargo clippy -p protocol-adapter --features dev-teardown --all-targets -- \
            -D warnings \
            -A unexpected_cfgs \
            -A deprecated

  # Rust unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      - name: Run tests
        working-directory: ./solana-pa-prototype
        run: cargo test -p protocol-adapter -p block-time-forwarder

  # Anchor integration tests, once per proof mode: real Groth16 fixtures
  # against the devnet-cloned verifier, and mock fixtures against the
  # localnet mock verifier.
  anchor-test:
    name: Anchor Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [real, mock]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-pa-prototype

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Create Solana keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Install Anchor CLI
        run: |
          curl -fsSL -o anchor "https://github.com/coral-xyz/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu"
          chmod +x anchor
          sudo mv anchor /usr/local/bin/

      - name: Install node dependencies
        working-directory: ./solana-pa-prototype
        run: yarn install --frozen-lockfile || yarn install

      - name: Build and test
        working-directory: ./solana-pa-prototype
        run: PA_TEST_MODE=${{ matrix.mode }} ./scripts/anchor-test.sh
