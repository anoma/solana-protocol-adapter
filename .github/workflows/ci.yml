name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build Docker image once and cache for all jobs
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./solana-pa-prototype
          file: ./solana-pa-prototype/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: solana-pa-dev:latest
          build-args: |
            UID=1001
            GID=1001
            DOCKER_GID=30001

      - name: Save Docker image
        run: docker save solana-pa-dev:latest | gzip > /tmp/solana-pa-dev.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/solana-pa-dev.tar.gz
          retention-days: 1

  # Rust format check
  fmt:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/solana-pa-dev.tar.gz | docker load

      - name: Check formatting
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -w /workspace/solana-pa-prototype \
            solana-pa-dev:latest \
            cargo fmt -p solana-pa-prototype -p block-time-forwarder --check

  # Clippy linting
  clippy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/solana-pa-dev.tar.gz | docker load

      - name: Run clippy
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -w /workspace/solana-pa-prototype \
            solana-pa-dev:latest \
            cargo clippy -p solana-pa-prototype -p block-time-forwarder --all-targets -- -D warnings

  # Rust unit tests
  test:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/solana-pa-dev.tar.gz | docker load

      - name: Run tests
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -w /workspace/solana-pa-prototype \
            solana-pa-dev:latest \
            cargo test -p solana-pa-prototype -p block-time-forwarder

  # Anchor integration tests
  anchor-test:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/solana-pa-dev.tar.gz | docker load

      - name: Install dependencies
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -v "${{ github.workspace }}/risc0-solana:/workspace/risc0-solana" \
            -w /workspace/solana-pa-prototype \
            solana-pa-dev:latest \
            bash -lc '
              yarn install --frozen-lockfile || yarn install
              cd /workspace/risc0-solana/solana-verifier && (yarn install --frozen-lockfile || yarn install)
            '

      - name: Build Anchor programs
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -v "${{ github.workspace }}/risc0-solana:/workspace/risc0-solana" \
            -w /workspace/solana-pa-prototype \
            solana-pa-dev:latest \
            anchor build

      - name: Start Solana validator
        working-directory: ./solana-pa-prototype
        run: |
          docker run -d --name solana-validator \
            -p 8899:8899 -p 8900:8900 -p 9900:9900 \
            solana-pa-dev:latest \
            solana-test-validator --reset --ledger /tmp/ledger --rpc-port 8899 --faucet-port 9900 --bind-address 0.0.0.0 --log

      - name: Wait for validator
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8899/health >/dev/null 2>&1; then
              echo "Validator ready"
              break
            fi
            echo "Waiting for validator... ($i/60)"
            sleep 1
          done
          curl -fsS http://localhost:8899/health

      - name: Deploy and run tests
        working-directory: ./solana-pa-prototype
        run: |
          docker run --rm \
            --network host \
            -v "$(pwd):/workspace/solana-pa-prototype" \
            -v "${{ github.workspace }}/risc0-solana:/workspace/risc0-solana" \
            -w /workspace/solana-pa-prototype \
            -e ANCHOR_PROVIDER_URL=http://localhost:8899 \
            solana-pa-dev:latest \
            bash -lc '
              solana config set --url http://localhost:8899
              solana airdrop 10 || true
              anchor test --skip-local-validator --skip-build --provider.cluster http://localhost:8899
            '

      - name: Cleanup validator
        if: always()
        run: docker rm -f solana-validator || true
